services:
  - type: web
    name: apiss-remote-relay
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: AGENT_SECRET
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: LICENSE_PRIVATE_KEY
        sync: false
      - key: LICENSE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
